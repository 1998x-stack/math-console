<circle cx="725" cy="405" r="105" stroke="#257c94" stroke-width="4" fill="none"/>
<line x1="575" y1="255" x2="875" y2="555" stroke="#d07735" stroke-width="4"/>
<circle cx="725" cy="405" r="5" fill="#257c94"/><text x="739" y="393" font-size="18" fill="#257c94">C(1,1)</text>
<text x="861" y="534" font-size="21" fill="#d07735">l</text><text x="892" y="464" font-size="17" fill="#667788">x</text><text x="680" y="224" font-size="17" fill="#667788">y</text>
<text x="60" y="515" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#667788">图为示意，数学条件以题面为准。</text>
