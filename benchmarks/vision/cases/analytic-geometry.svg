<text x="60" y="75" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#24364c">原创测试题 B · 解析几何</text>
<text x="60" y="143" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" fill="#172b4d">已知圆 C：(x − 1)² + (y − 1)² = 4，</text>
<text x="60" y="190" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" fill="#172b4d">直线 l：x + y = 2。</text>
<text x="60" y="275" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" fill="#172b4d">(1) 求直线 l 与圆 C 的交点坐标。</text>
<text x="60" y="341" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" fill="#172b4d">(2) 判断 l 是否经过圆心，并说明理由。</text>
<line x1="570" y1="470" x2="899" y2="470" stroke="#8394a6" stroke-width="2"/><line x1="670" y1="545" x2="670" y2="210" stroke="#8394a6" stroke-width="2"/>
