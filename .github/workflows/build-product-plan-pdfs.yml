name: Build AI math education PDFs

on:
  push:
    branches: [main]
    paths:
      - "docs/product-plans/*.html"
      - ".github/workflows/build-product-plan-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-product-plan-pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-pdf:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Chinese font families
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core fonts-arphic-ukai fontconfig
          sudo fc-cache -f
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF renderer
        run: python -m pip install "weasyprint==68.0" "pypdf>=5,<7"
      - name: Render and validate three PDF documents
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from weasyprint import HTML

          root = Path("docs/product-plans")
          expected = {
              "AI_Math_A_Teacher_Workbench_2026": 10,
              "AI_Math_B_Interactive_Lab_2026": 10,
              "AI_Math_C_Personalized_Tutor_2026": 12,
          }
          for stem, expected_pages in expected.items():
              src = root / (stem + ".html")
              dest = root / (stem + ".pdf")
              HTML(filename=str(src), base_url=str(root)).write_pdf(str(dest))
              pages = len(PdfReader(str(dest)).pages)
              print(f"{dest}: {pages} pages, {dest.stat().st_size} bytes")
              if pages < expected_pages - 1 or pages > expected_pages + 2:
                  raise RuntimeError(
                      f"Unexpected page count for {stem}: {pages} "
                      f"(expected near {expected_pages})"
                  )
          PY
      - name: Commit generated PDFs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product-plans/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish three AI math education PDF plans"
            git push
          else
            echo "PDFs unchanged"
          fi
